name: Publish Collection

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install ansible ansible-lint

      - name: Lint with ansible-lint
        run: ansible-lint

      - name: Build collection
        run: ansible-galaxy collection build --output-path dist/ --force

      - name: Publish collection
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy collection publish --token=$ANSIBLE_GALAXY_API_KEY dist/*.tar.gz

      - name: Verify publication
        run: |
          echo "Collection published successfully"
          echo "Run: ansible-galaxy collection install ${{ vars.COLLECTION_NAMESPACE }}.${{ vars.COLLECTION_NAME }}"
