namespace: iamenr0s
name: ansible_linux_collection
version: 1.0.0
description: A collection of Ansible roles for Linux system administration. Covers user/group management, package upgrades, swap, kernel configuration, cgroups, firewalld, /etc/hosts, containerd, CRI-O, and SSH hardening.
readme: README.md
authors:
  - iamenr0s <https://github.com/iamenr0s>
license:
  - MIT
license_file: LICENSE
tags:
  - linux
  - system
  - administration
  - automation
  - users
  - groups
  - security
  - ssh
  - hardening
  - upgrade
  - swap
  - kernel
  - cgroup
  - firewalld
  - networking
  - etc-hosts
  - containerd
  - cri-o
  - containers
  - kubernetes
dependencies:
  ansible.posix: '>=1.0.0'
  community.general: '>=1.0.0'
repository: https://github.com/iamenr0s/ansible-linux-collection
homepage: https://github.com/iamenr0s/ansible-linux-collection
issues: https://github.com/iamenr0s/ansible-linux-collection/issues
documentation: https://github.com/iamenr0s/ansible-linux-collection/blob/main/README.md
build_ignore:
  - '*.tar.gz'
  - '.git'
  - '.git*'
  - '**/.git'
  - '**/.git*'
  - '**/.github'
  - '**/.vscode'
  - '.DS_Store'
  - 'tests/output'
  - '.pytest_cache'
  - '__pycache__'